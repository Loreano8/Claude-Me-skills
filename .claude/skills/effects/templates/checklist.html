<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0c0b09; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0c0b09; }
      #base, #cutout { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #headline { position: absolute; left: -40px; right: -40px; top: 170px; text-align: center; font-family: "Archivo Black", sans-serif; font-size: 230px; line-height: 0.9; letter-spacing: -0.04em; color: #fff; white-space: nowrap; opacity: 0; }
      #panel { position: absolute; left: 60px; right: 60px; bottom: 150px; padding: 34px 40px 22px; border-radius: 34px; background: rgba(16, 16, 18, 0.86); border: 2px solid rgba(255,255,255,0.12); box-shadow: 0 30px 80px rgba(0,0,0,0.5); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); opacity: 0; will-change: transform; }
      #ph { display: flex; justify-content: space-between; align-items: center; padding-bottom: 18px; }
      #ph-t { font-family: "Inter", sans-serif; font-weight: 800; font-size: 38px; color: #fff; white-space: nowrap; }
      #ph-t .star { color: #ff7a45; margin-right: 12px; }
      #ph-n { font-family: "JetBrains Mono", monospace; font-size: 26px; color: #a9a9b2; white-space: nowrap; }
      .it { display: flex; align-items: center; gap: 26px; height: 92px; border-top: 2px solid rgba(255,255,255,0.08); opacity: 0.4; }
      .ck { position: relative; flex: none; width: 52px; height: 52px; border-radius: 50%; border: 4px solid #6e6e78; }
      .ck .fill { position: absolute; inset: -4px; border-radius: 50%; }
      .ck svg { position: absolute; inset: 8px; width: 28px; height: 28px; }
      .ck path { stroke-dasharray: 40; stroke-dashoffset: 40; }
      .lb { flex: 1; font-family: "Inter", sans-serif; font-weight: 700; font-size: 38px; color: #fff; white-space: nowrap; }
      .mt { font-family: "JetBrains Mono", monospace; font-size: 26px; color: #a9a9b2; white-space: nowrap; }
    </style>
  </head>
  <body>
    <!-- /effects checklist: an editing checklist ticks itself off, optional headline behind the speaker. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DURATION}}" data-width="1080" data-height="1920">
      <video id="base" class="clip" src="assets/video/source.mp4" data-start="0" data-duration="{{DURATION}}" data-track-index="0" muted playsinline></video>
      <div id="headline" data-layout-allow-overflow data-layout-allow-occlusion></div>
      {{CUTOUT}}
      <div id="panel"><div id="ph"><div id="ph-t"><span class="star">✳</span><span id="ph-tt"></span></div><div id="ph-n"></div></div><div id="list"></div></div>
      {{AUDIO}}
    </div>
    <script>
      const CFG = {{CONFIG}};
      const D = {{DURATION}};
      const $ = (id) => document.getElementById(id);
      const N = CFG.items.length;
      $("ph-tt").textContent = CFG.header;
      $("headline").textContent = CFG.headline || "";
      CFG.items.forEach((it, i) => {
        const row = document.createElement("div");
        row.className = "it";
        row.id = "it-" + i;
        row.innerHTML = `<div class="ck"><div class="fill" id="fill-${i}" style="background:${CFG.accent}"></div><svg viewBox="0 0 28 28"><path id="tick-${i}" d="M5 14.5 L11.5 21 L23 8" fill="none" stroke="#0c0b09" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="lb"></div><div class="mt"></div>`;
        row.querySelector(".lb").textContent = it.label;
        row.querySelector(".mt").textContent = it.meta || "";
        $("list").appendChild(row);
      });

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#panel", { opacity: 0, y: 120 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 0.2);
      tl.set("#ph-n", { textContent: `0 of ${N}` }, 0);
      const start = 0.9, end = Math.max(start + N * 0.4, D - 0.8), step = (end - start) / N;
      CFG.items.forEach((it, i) => {
        const t = start + i * step;
        tl.to("#it-" + i, { opacity: 1, duration: 0.2 }, t - 0.25);
        tl.fromTo("#fill-" + i, { scale: 0 }, { scale: 1, duration: 0.25, ease: "back.out(2.2)" }, t);
        tl.to("#tick-" + i, { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" }, t + 0.1);
        tl.set("#ph-n", { textContent: `${i + 1} of ${N}` }, t);
        if (CFG.headline && i === CFG.headline_at) {
          tl.fromTo("#headline", { opacity: 0, scale: 0.8, y: 60 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(1.6)" }, t);
        }
      });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
