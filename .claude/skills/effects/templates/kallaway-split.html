<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0c0b09; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0c0b09; }
      #top { position: absolute; left: 0; right: 0; top: 0; height: 960px; overflow: hidden; background: #0f0e0c; }
      #grid { position: absolute; inset: -120px; background-image: linear-gradient(rgba(255,255,255,0.05) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,0.05) 2px, transparent 2px); background-size: 120px 120px; }
      #head { position: absolute; left: 70px; right: 300px; top: 90px; font-family: "Archivo Black", sans-serif; font-size: 60px; line-height: 1.08; letter-spacing: -0.03em; color: #f5f1e6; }
      #head .w { display: inline-block; opacity: 0; }
      #stat { position: absolute; right: 60px; top: 96px; padding: 18px 26px; border-radius: 20px; font-family: "Archivo Black", sans-serif; font-size: 54px; color: #0c0b09; opacity: 0; }
      #chart { position: absolute; left: 70px; right: 70px; top: 330px; height: 500px; }
      .col { position: absolute; bottom: 60px; display: flex; flex-direction: column; align-items: center; }
      .colbar { width: 100%; border-radius: 16px 16px 6px 6px; transform-origin: 50% 100%; }
      .colval { position: absolute; left: 0; right: 0; text-align: center; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 30px; color: #f5f1e6; opacity: 0; }
      .collbl { position: absolute; left: 0; right: 0; bottom: -52px; text-align: center; font-family: "JetBrains Mono", monospace; font-size: 26px; color: #b9b2a3; }
      #line { position: absolute; left: 0; top: 0; width: 940px; height: 440px; overflow: visible; }
      #src { position: absolute; left: 70px; bottom: 34px; font-family: "JetBrains Mono", monospace; font-size: 22px; color: #9d968a; }
      #bottom { position: absolute; left: 0; right: 0; top: 960px; height: 960px; overflow: hidden; }
      #cam { position: absolute; inset: 0; will-change: transform; }
      #base { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #divider { position: absolute; left: 0; right: 0; top: 954px; height: 12px; transform-origin: 0 50%; }
    </style>
  </head>
  <body>
    <!-- /effects kallaway-split: animated chart on top, the speaker on the bottom half. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DURATION}}" data-width="1080" data-height="1920">
      <div id="top">
        <div id="grid" data-layout-allow-overflow></div>
        <div id="head"></div>
        <div id="stat"></div>
        <div id="chart"></div>
        <div id="src"></div>
      </div>
      <div id="bottom">
        <div id="cam" data-layout-allow-overflow>
          <video id="base" class="clip" src="assets/video/source.mp4" data-start="0" data-duration="{{DURATION}}" data-track-index="0" muted playsinline></video>
        </div>
      </div>
      <div id="divider"></div>
      {{AUDIO}}
    </div>
    <script>
      const CFG = {{CONFIG}};
      const D = {{DURATION}};
      const $ = (id) => document.getElementById(id);
      $("base").style.objectPosition = CFG.focus;
      $("divider").style.background = CFG.accent;
      $("stat").style.background = CFG.accent;
      $("stat").textContent = CFG.stat;
      $("src").textContent = CFG.source;
      CFG.headline.split(" ").forEach((w, i, a) => { const s = document.createElement("span"); s.className = "w"; s.textContent = w; $("head").appendChild(s); if (i < a.length - 1) $("head").appendChild(document.createTextNode(" ")); });

      const tl = gsap.timeline({ paused: true });
      const n = CFG.data.length, max = Math.max(...CFG.data.map((d) => d.value)), CW = 940, CH = 440;
      tl.fromTo("#divider", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "expo.out" }, 0);
      tl.fromTo("#cam", { scale: 1.15 }, { scale: 1.02, duration: D, ease: "none" }, 0);
      tl.fromTo("#grid", { y: 0 }, { y: -120, duration: D, ease: "none" }, 0);
      gsap.utils.toArray("#head .w").forEach((el, i) => tl.fromTo(el, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.3, ease: "power4.out" }, 0.2 + i * 0.07));
      const t0 = 0.6, grow = Math.min(2.4, D * 0.4);
      if (CFG.chart === "line") {
        const pts = CFG.data.map((d, i) => [(i / (n - 1)) * CW, CH - (d.value / max) * (CH - 40)]);
        const path = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
        $("chart").innerHTML = `<svg id="line" viewBox="0 0 ${CW} ${CH}"><path id="lp" d="${path}" fill="none" stroke="${CFG.accent}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
        const len = $("lp").getTotalLength();
        tl.fromTo("#lp", { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: grow, ease: "power2.inOut" }, t0);
        CFG.data.forEach((d, i) => {
          const dot = document.createElement("div");
          dot.id = "dot-" + i;
          Object.assign(dot.style, { position: "absolute", left: pts[i][0] - 14 + "px", top: pts[i][1] - 14 + "px", width: "28px", height: "28px", borderRadius: "50%", background: CFG.accent, opacity: 0 });
          $("chart").appendChild(dot);
          tl.fromTo("#dot-" + i, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, t0 + (grow * i) / (n - 1));
        });
      } else {
        const gap = 26, bw = (CW - gap * (n - 1)) / n;
        CFG.data.forEach((d, i) => {
          const h = (d.value / max) * (CH - 70);
          const col = document.createElement("div");
          col.className = "col";
          Object.assign(col.style, { left: i * (bw + gap) + "px", width: bw + "px", height: h + "px" });
          col.innerHTML = `<div class="colbar" id="bar-${i}" style="height:${h}px;background:${i === n - 1 ? CFG.accent : "#4a463e"}"></div><div class="colval" id="val-${i}" style="top:-48px">${d.value}${CFG.unit}</div><div class="collbl">${d.label}</div>`;
          $("chart").appendChild(col);
          const t = t0 + (grow * i) / n;
          tl.fromTo("#bar-" + i, { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "back.out(1.4)" }, t);
          tl.fromTo("#val-" + i, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, t + 0.3);
        });
      }
      tl.fromTo("#stat", { opacity: 0, scale: 0.5, rotation: -8 }, { opacity: 1, scale: 1, rotation: -3, duration: 0.4, ease: "back.out(2)" }, t0 + grow);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
