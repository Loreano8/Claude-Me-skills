<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0c0b09; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0c0b09; }
      #cam { position: absolute; inset: 0; will-change: transform; }
      #base { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #shade { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.25), rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,0.35)); }
      .g { position: absolute; border-radius: 36px; background: rgba(28, 26, 24, 0.42); border: 2px solid rgba(255,255,255,0.32); box-shadow: 0 24px 60px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.35); backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4); color: #fff; font-family: "Inter", sans-serif; opacity: 0; will-change: transform; }
      .k { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 22px; letter-spacing: 0.14em; color: rgba(255,255,255,0.86); }
      #w-stat { left: 50px; top: 150px; width: 320px; height: 320px; padding: 32px; }
      #w-stat .big { margin-top: 18px; font-family: "Inter", sans-serif; font-weight: 800; font-size: 130px; line-height: 1; letter-spacing: -0.04em; }
      #w-stat .lbl { margin-top: 8px; font-size: 34px; font-weight: 600; color: rgba(255,255,255,0.9); }
      #w-prog { left: 590px; top: 160px; width: 440px; height: 170px; padding: 30px 34px; }
      #w-prog .row { display: flex; justify-content: space-between; align-items: baseline; }
      #w-prog .pl { font-size: 34px; font-weight: 700; }
      #w-prog .pp { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 30px; }
      #w-prog .track { margin-top: 26px; height: 18px; border-radius: 999px; background: rgba(255,255,255,0.22); overflow: hidden; }
      #w-prog .fill { width: 100%; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #ff8a5c, #ff4f6d); transform-origin: 0 50%; }
      #w-chart { left: 50px; top: 560px; width: 320px; height: 380px; padding: 30px; }
      #w-chart .v { margin-top: 10px; font-weight: 800; font-size: 74px; letter-spacing: -0.03em; color: #ffb59a; }
      #w-chart .bars { position: absolute; left: 30px; right: 30px; bottom: 30px; height: 150px; display: flex; align-items: flex-end; gap: 14px; }
      #w-chart .bar { flex: 1; border-radius: 10px 10px 4px 4px; background: linear-gradient(to top, #ff4f6d, #ff8a5c); transform-origin: 50% 100%; }
      #w-prof { left: 640px; top: 420px; width: 390px; height: 150px; padding: 26px 30px; display: flex; align-items: center; gap: 24px; }
      #w-prof .av { flex: none; width: 96px; height: 96px; border-radius: 50%; background: linear-gradient(135deg, #ffb36b, #ff4f6d); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 46px; color: #1a1712; }
      #w-prof .nm { font-size: 36px; font-weight: 800; white-space: nowrap; }
      #w-prof .hd { margin-top: 6px; font-size: 24px; color: rgba(255,255,255,0.86); white-space: nowrap; }
      #w-badge { left: 840px; top: 640px; width: 180px; height: 180px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 56px; }
      #w-badge svg { position: absolute; inset: 10px; width: 160px; height: 160px; transform: rotate(-90deg); }
      #w-chip { left: 50%; bottom: 260px; width: 520px; margin-left: -260px; height: 96px; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 16px; font-size: 36px; font-weight: 700; white-space: nowrap; }
      #w-chip .dot { width: 18px; height: 18px; border-radius: 50%; background: #ff8a5c; }
    </style>
  </head>
  <body>
    <!-- /effects glass-widgets: frosted glass dashboard cards float around the speaker. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DURATION}}" data-width="1080" data-height="1920">
      <div id="cam" data-layout-allow-overflow>
        <video id="base" class="clip" src="assets/video/source.mp4" data-start="0" data-duration="{{DURATION}}" data-track-index="0" muted playsinline></video>
      </div>
      <div id="shade"></div>
      <div class="g" id="w-stat"><div class="k" id="w-stat-k"></div><div class="big" id="w-stat-v">0</div><div class="lbl" id="w-stat-l"></div></div>
      <div class="g" id="w-prog"><div class="row"><div class="pl" id="w-prog-l"></div><div class="pp" id="w-prog-p">0%</div></div><div class="track"><div class="fill" id="w-prog-f"></div></div></div>
      <div class="g" id="w-chart"><div class="k" id="w-chart-t"></div><div class="v" id="w-chart-v"></div><div class="bars" id="w-chart-b"></div></div>
      <div class="g" id="w-prof"><div class="av" id="w-prof-a"></div><div><div class="nm" id="w-prof-n"></div><div class="hd" id="w-prof-h"></div></div></div>
      <div class="g" id="w-badge"><svg viewBox="0 0 160 160"><circle cx="80" cy="80" r="72" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="8"/><circle id="w-ring" cx="80" cy="80" r="72" fill="none" stroke="#3ddc84" stroke-width="8" stroke-linecap="round" stroke-dasharray="452.4" stroke-dashoffset="452.4"/></svg><span id="w-badge-t"></span></div>
      <div class="g" id="w-chip"><span class="dot"></span><span id="w-chip-t"></span></div>
      {{AUDIO}}
    </div>
    <script>
      const CFG = {{CONFIG}};
      const D = {{DURATION}};
      const $ = (id) => document.getElementById(id);
      $("w-stat-k").textContent = CFG.stat.kicker;
      $("w-stat-l").textContent = CFG.stat.label;
      $("w-prog-l").textContent = CFG.progress.label;
      $("w-chart-t").textContent = CFG.chart.title.toUpperCase();
      $("w-chart-v").textContent = CFG.chart.value;
      CFG.chart.bars.forEach((v, i) => { const b = document.createElement("div"); b.className = "bar"; b.id = "w-bar-" + i; b.style.height = Math.round(v * 100) + "%"; $("w-chart-b").appendChild(b); });
      $("w-prof-a").textContent = CFG.profile.name.charAt(0).toUpperCase();
      $("w-prof-n").textContent = CFG.profile.name;
      $("w-prof-h").textContent = CFG.profile.handle;
      $("w-badge-t").textContent = CFG.badge;
      $("w-chip-t").textContent = CFG.chip;

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#cam", { scale: 1.08 }, { scale: 1, duration: D, ease: "none" }, 0);
      const cards = ["#w-stat", "#w-prog", "#w-prof", "#w-chart", "#w-badge", "#w-chip"];
      cards.forEach((id, i) => {
        const t = 0.25 + i * 0.22;
        tl.fromTo(id, { opacity: 0, scale: 0.6, y: 50 }, { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "back.out(1.7)" }, t);
        // gentle float for the rest of the clip (finite repeats keep it seek-safe)
        const span = Math.max(0.1, D - t - 0.6);
        const half = 1.6 + (i % 3) * 0.35;
        tl.to(id, { y: i % 2 ? 14 : -14, duration: half, ease: "sine.inOut", yoyo: true, repeat: Math.max(0, Math.floor(span / half) - 1) }, t + 0.6);
      });
      // stat count-up, step by step
      const n = Number(CFG.stat.value) || 0, steps = 24;
      for (let s = 0; s <= steps; s++) tl.set("#w-stat-v", { textContent: Math.round((n * s) / steps) + (CFG.stat.suffix || "") }, 0.4 + (s / steps) * 1.2);
      // progress bar and percent
      tl.fromTo("#w-prog-f", { scaleX: 0 }, { scaleX: CFG.progress.pct / 100, duration: Math.min(3, D * 0.5), ease: "power2.out" }, 0.8);
      for (let s = 0; s <= 20; s++) tl.set("#w-prog-p", { textContent: Math.round((CFG.progress.pct * s) / 20) + "%" }, 0.8 + (s / 20) * Math.min(3, D * 0.5));
      CFG.chart.bars.forEach((v, i) => tl.fromTo("#w-bar-" + i, { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "back.out(1.6)" }, 1.2 + i * 0.08));
      tl.to("#w-ring", { strokeDashoffset: 0, duration: 1.2, ease: "power2.inOut" }, 1.4);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
