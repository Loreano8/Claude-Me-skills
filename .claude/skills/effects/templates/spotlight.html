<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #base, #cutout { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #dark { position: absolute; inset: 0; --r: 0px; }
      #beam { position: absolute; left: 0; right: 0; top: 0; height: 1500px; clip-path: polygon(44% 0, 56% 0, 88% 100%, 12% 100%); opacity: 0; }
      #title { position: absolute; left: -40px; right: -40px; top: 230px; text-align: center; font-family: "Bebas Neue", sans-serif; font-size: 400px; line-height: 0.9; letter-spacing: 0.02em; white-space: nowrap; opacity: 0; }
      #sub { position: absolute; left: 0; right: 0; bottom: 230px; text-align: center; font-family: "Inter", sans-serif; font-weight: 800; font-size: 48px; letter-spacing: 0.04em; color: #fff; text-shadow: 0 4px 30px rgba(0,0,0,0.9); opacity: 0; }
      #sub span { padding: 16px 30px; border-radius: 999px; background: rgba(0,0,0,0.55); }
    </style>
  </head>
  <body>
    <!-- /effects spotlight: the room goes dark, a spotlight lands on the speaker, a glowing title lights up behind them. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DURATION}}" data-width="1080" data-height="1920">
      <video id="base" class="clip" src="assets/video/source.mp4" data-start="0" data-duration="{{DURATION}}" data-track-index="0" muted playsinline></video>
      <div id="dark"></div>
      <div id="beam"></div>
      <div id="title" data-layout-allow-overflow data-layout-allow-occlusion></div>
      {{CUTOUT}}
      <div id="sub"><span id="sub-t"></span></div>
      {{AUDIO}}
    </div>
    <script>
      const CFG = {{CONFIG}};
      const D = {{DURATION}};
      const $ = (id) => document.getElementById(id);
      const g = CFG.glow;
      $("dark").style.background = `radial-gradient(ellipse calc(var(--r) * 0.8) var(--r) at ${CFG.spot_x} ${CFG.spot_y}, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.9) 100%)`;
      $("beam").style.background = `linear-gradient(to bottom, rgba(255,240,220,0.32), rgba(255,240,220,0.06) 70%, rgba(255,240,220,0))`;
      $("title").textContent = CFG.title;
      $("title").style.color = "#fff3ea";
      $("title").style.textShadow = `0 0 12px ${g}, 0 0 40px ${g}, 0 0 90px ${g}, 0 0 160px ${g}`;
      $("sub-t").textContent = CFG.subtitle;

      const tl = gsap.timeline({ paused: true });
      // Lights out, then the spotlight opens on the speaker
      tl.fromTo("#dark", { "--r": "0px" }, { "--r": "1400px", duration: 0.01 }, 0);
      tl.to("#dark", { "--r": "160px", duration: 0.5, ease: "power3.in" }, 0.1);
      tl.to("#dark", { "--r": "820px", duration: 0.9, ease: "expo.out" }, 0.75);
      tl.to("#dark", { "--r": "760px", duration: Math.max(0.5, D - 1.8), ease: "sine.inOut" }, 1.65);
      tl.fromTo("#beam", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, 0.75);
      // Neon flicker-in behind the speaker
      [[0.95, 0.9], [1.0, 0.15], [1.08, 1], [1.14, 0.3], [1.2, 1]].forEach(([t, o]) => tl.set("#title", { opacity: o }, t));
      tl.fromTo("#title", { scale: 1.08 }, { scale: 1, duration: Math.max(1, D - 1), ease: "none" }, 0.95);
      tl.fromTo("#sub", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 1.5);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
