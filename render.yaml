# Site CV Studio sur Render : uniquement les pages (site statique, gratuit, sans mise en veille).
# Le serveur (IA, comptes, paiements) est une fonction Supabase : voir cv-generator/README.md.
services:
  - type: web
    runtime: static
    name: cv-studio-site
    buildCommand: cd cv-generator && npm ci --include=dev && npm run build
    staticPublishPath: cv-generator/dist
    envVars:
      - key: VITE_API_URL
        value: https://clgmqhyzyiswnekmoygw.supabase.co/functions/v1
      - key: NODE_VERSION
        value: "22"
